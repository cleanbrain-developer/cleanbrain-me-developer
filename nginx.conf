server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # next build with output: "export" emits <route>.html files (not
  # <route>/index.html) for every non-root route, so a plain
  # `try_files $uri $uri/ /index.html` (the cleanbrain-me-entrance pattern,
  # correct for that project's client-routed SPA) would not resolve them.
  # This site has no client-side router fallback to fall back to anyway --
  # every route is pre-rendered at build time, so an unmatched path is a
  # real 404, not something to hand to index.html.
  location / {
    try_files $uri $uri.html $uri/ =404;
  }

  location /_next/static/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # next build with output: "export" emits the code-generated OG image
  # (src/app/opengraph-image.tsx) as a file literally named "opengraph-image"
  # -- no extension -- so nginx's extension-based mime.types lookup falls
  # back to its default_type (application/octet-stream) instead of
  # image/png. Social-link unfurlers (LinkedIn, Slack, etc.) check the
  # Content-Type header, not just the bytes, so a wrong type here silently
  # breaks the share-card image this file exists for. Found by actually
  # curling -I the deployed file, not assumed correct from the build output.
  location = /opengraph-image {
    default_type image/png;
  }

  error_page 404 /404.html;
}
