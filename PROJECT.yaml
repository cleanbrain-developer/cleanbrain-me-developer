schema_version: 1

project:
  name: developer.cleanbrain.me
  repository: cleanbrain-me-developer
  abbreviation: developer
  type: web-application
  lifecycle: active

purpose:
  summary: >-
    A developer profile, engineering portfolio, and live production monitoring
    dashboard for cleanbrain.developer, served at developer.cleanbrain.me. It
    proves backend and distributed-systems capability by showing real, live
    telemetry from relayhub-java (a real event-driven pipeline this same
    developer built and operates), not only writing about it. The site's
    original interactive mock simulation (Phase 3-4) was removed once real
    data became available and the mock was confirmed unused — see ADR-0005.
  problem: >-
    A conventional resume-style portfolio page describes backend and
    distributed-systems experience in prose that a recruiter or engineer
    cannot verify in the time they spend on the page. There is no place that
    lets a visitor directly observe ingestion, validation, retry, DLQ, and
    replay behavior the way the underlying RelayHub project actually behaves.

supported_agents:
  initial:
    - codex
    - claude-code
  policy: agent-agnostic-core

principles:
  - repository-first-context
  - agent-agnostic-core
  - thin-agent-adapters
  - minimal-task-prompts
  - evidence-before-change
  - explicit-architecture-decisions
  - deterministic-quality-gates-when-implemented

current_phase:
  id: deployed-ci-driven
  status: active
  goal: >-
    https://developer.cleanbrain.me is live in production with CI-driven
    deploys verified end to end (2026-09-13), and / now redirects to a real
    Live Monitoring dashboard (relayhub-java's actual telemetry, auto-
    refreshing) after the Mock RelayHub Lab was removed as confirmed unused
    (ADR-0005). No remaining foundation or deployment gaps; ordinary
    feature/content work from here. See docs/status/current-state.md, "Next".

context:
  human_entrypoint: README.md
  agent_entrypoints:
    codex: AGENTS.md
    claude_code: CLAUDE.md
  constitution: .ai/constitution/
  product: docs/product/
  architecture: docs/architecture/
  decisions: docs/decisions/
  current_state: docs/status/current-state.md

delivery:
  implementation_present: true
  cli_present: false
  automation_present: true
